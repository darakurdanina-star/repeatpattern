<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Повтори узор</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    text-align: center;
    background: #ffeef5;
}

.screen { display: none; }
.active { display: block; }

#gameContainer {
    width: 90%;
    max-width: 420px;
    margin: 0 auto;
}

#background {
    width: 100%;
    aspect-ratio: 3/4;
    background: url('png/background.png') center/cover no-repeat;
    border-radius: 20px;
    position: relative;
}

#nastya {
    width: 25%;
    position: absolute;
    top: 10px;
    left: 10px;
}

#speechBox {
    position: absolute;
    top: 30%;
    left: 5%;
    width: 90%;
    min-height: 60px;
    background: #fff8c4;
    border-radius: 12px;
    padding: 10px;
    font-size: 16px;
}

.game-btn {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    font-size: 16px;
    background: #ff69b4;
    color: white;
    border: none;
    border-radius: 12px;
    width: 60%;
    max-width: 220px;
}

#gameArea, #gameArea2 {
    position: absolute;
    bottom: 10px;
    width: 100%;
}

.slot {
    width: 18vw;
    height: 18vw;
    max-width: 70px;
    max-height: 70px;
    border: 3px dashed #aaa;
    border-radius: 15px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 6px;
}

.item-bottom {
    width: 20vw;
    max-width: 80px;
    margin: 6px;
    touch-action: none;
}
.highlight {
    outline: 3px solid #ff69b4;
    border-radius: 10px;
}
</style>
</head>

<body>

<div id="screen1" class="screen active">
    <div id="gameContainer">
        <div id="background">
            <img id="nastya" src="png/nastya.png">
            <div id="speechBox"></div>
            <button class="game-btn" onclick="startGame()">Начать</button>
        </div>
    </div>
</div>

<div id="screen2" class="screen">
    <div id="gameContainer">
        <div id="background">
            <img id="nastya" src="png/nastya.png">
            <div id="speechBox"></div>
            <div id="gameArea"></div>
        </div>
    </div>
</div>

<div id="screen3" class="screen">
    <div id="gameContainer">
        <div id="background">
            <img id="nastya" src="png/nastya.png">
            <div id="speechBox"></div>
            <div id="gameArea2"></div>
        </div>
    </div>
</div>

<audio id="sound1" src="sounds/sound1.mp3"></audio>
<audio id="sound2" src="sounds/sound2.mp3"></audio>
<audio id="sound3" src="sounds/sound3.mp3"></audio>
<audio id="sound5" src="sounds/sound5.mp3"></audio>
<audio id="sound6" src="sounds/sound6.mp3"></audio>
<audio id="sound7" src="sounds/sound7.mp3"></audio>
<audio id="sound8" src="sounds/sound8.mp3"></audio>
<audio id="sound9" src="sounds/sound9.mp3"></audio>

<script>
const correctOrder = ["png/rose.png","png/sun.png","png/bear_full.png","png/raspberry.png"];
let userOrder = [null,null,null,null];
let selected = null;
let currentSound = null;
let clone = null;
let offsetX = 0, offsetY = 0;

function getSpeechBox(){ return document.querySelector('.screen.active #speechBox'); }
function playSound(id, callback=null){ if(currentSound){ currentSound.pause(); currentSound.currentTime=0; } currentSound=document.getElementById(id); currentSound.play().catch(()=>{}); if(callback) currentSound.onended=callback; }
function switchScreen(n){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('screen'+n).classList.add('active'); }

function startGame(){ switchScreen(2); getSpeechBox().innerText="Я нарисовала очень красивый рисунок, сможешь повторить?"; playSound("sound1", showPattern); }

function showPattern(){
    const area=document.getElementById('gameArea'); area.innerHTML="";
    getSpeechBox().innerText="А теперь запоминай мой рисунок, у тебя 10 секунд.";
    correctOrder.forEach(src=>{
        const img=document.createElement('img');
        img.src=src;
        img.className='item-bottom';
        area.appendChild(img);
    });
    playSound("sound2");
    setTimeout(startGamePhase,10000);
}

function startGamePhase(){
    const area=document.getElementById('gameArea'); area.innerHTML=""; userOrder=[null,null,null,null];
    const slotsWrap=document.createElement('div'); area.appendChild(slotsWrap);
    for(let i=0;i<4;i++){ const slot=document.createElement('div'); slot.className='slot'; slot.dataset.index=i; slotsWrap.appendChild(slot); }
    const shuffled=[...correctOrder].sort(()=>Math.random()-0.5);
    const container=document.createElement('div');
    shuffled.forEach(src=>{
        const img=document.createElement('img');
        img.src=src;
        img.className='item-bottom';
        img.dataset.placed="false";
        makeDraggable(img);
        container.appendChild(img);
    });
    area.appendChild(container);
    getSpeechBox().innerText="Попробуй нарисовать также как я."; playSound("sound3");
}

function isMobile(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }

function makeDraggable(el){
    el.draggable = !isMobile();
    if(!isMobile()){ el.ondragstart=()=>selected=el; }
    else{
        el.addEventListener('touchstart', e=>{
            e.preventDefault();
            if(el.dataset.placed==="true") return; // нельзя брать элемент уже использованный
            selected = el;
            const rect = el.getBoundingClientRect();
            offsetX = e.touches[0].clientX - rect.left;
            offsetY = e.touches[0].clientY - rect.top;
            clone = el.cloneNode(true);
            clone.style.position="absolute"; clone.style.zIndex=1000;
            clone.style.width = rect.width+"px"; clone.style.height = rect.height+"px";
            clone.style.pointerEvents="none";
            document.body.appendChild(clone);
        });
        el.addEventListener('touchmove', e=>{
            if(!clone) return;
            e.preventDefault();
            clone.style.left = (e.touches[0].clientX - offsetX) + "px";
            clone.style.top = (e.touches[0].clientY - offsetY) + "px";
        });
        el.addEventListener('touchend', e=>{
            if(!clone) return;
            let placed = false;
            document.querySelectorAll('.slot').forEach(slot=>{
                const r = slot.getBoundingClientRect();
                const s = clone.getBoundingClientRect();
                if(!(s.right<r.left||s.left>r.right||s.bottom<r.top||s.top>r.bottom)){
                    if(!slot.children.length){
                        const finalClone = selected.cloneNode();
                        finalClone.style.width="auto"; finalClone.style.height="100%";
                        finalClone.style.maxWidth="100%";
                        finalClone.style.objectFit="contain";
                        slot.appendChild(finalClone);
                        const idx = slot.dataset.index;
                        if(idx!==undefined) userOrder[idx]=selected.src;
                        selected.dataset.placed="true"; // блокируем оригинал
                        placed=true;
                    }
                }
            });
            clone.remove(); clone=null; if(placed) selected=null; checkResult();
        });
    }

    document.querySelectorAll('.slot').forEach(slot=>{
        slot.ondragover=(e)=>e.preventDefault();
        slot.ondrop=(e)=>{
            e.preventDefault();
            if(!selected || slot.children.length) return;
            const finalClone = selected.cloneNode();
            finalClone.style.width="100%"; finalClone.style.height="100%";
            slot.appendChild(finalClone);
            userOrder[slot.dataset.index]=selected.src;
            if(!isMobile()) selected.remove(); selected=null;
            checkResult();
        }
    });
}

function checkResult(){
    if(userOrder.includes(null)) return;
    let correct=true;
    for(let i=0;i<4;i++){ if(!userOrder[i].includes(correctOrder[i])) correct=false; }
    if(correct){
        setTimeout(()=>{
            switchScreen(3);
            getSpeechBox().innerText="Ты молодец! Справишься с другим заданием? Запомни мой новый рисунок, а через 10 секунд - найди такой же!";
            playSound("sound6"); showSecondButton();
        },1500);
    } else { getSpeechBox().innerText="Попробуй еще раз, запоминай внимательнее!"; playSound("sound5", showPattern); }
}

/* Второй этап */
function showSecondButton(){
    const area=document.getElementById('gameArea2'); area.innerHTML="";
    const btn=document.createElement('button'); btn.innerText="Продолжим"; btn.className='game-btn';
    btn.onclick=()=>{ btn.remove(); showBearPreview(); };
    area.appendChild(btn);
}

function showBearPreview(){
    const area=document.getElementById('gameArea2'); area.innerHTML="";
    const correct="png/bear_red_bow.png";
    const bear=document.createElement('img'); bear.src=correct; bear.style.width='120px'; area.appendChild(bear);
    setTimeout(()=>{ playSound('sound7'); showBearChoices(); },10000);
}

function showBearChoices(){
    const area=document.getElementById('gameArea2'); area.innerHTML="";
    const correct="png/bear_red_bow.png";
    const slot=document.createElement('div'); slot.className='slot'; area.appendChild(slot);

    const bears=[correct,"png/bear_blue_cap.png","png/bear_with_candy.png"].sort(()=>Math.random()-0.5);
    const container=document.createElement('div');
    bears.forEach(src=>{
        const img=document.createElement('img'); img.src=src; img.className='item-bottom'; img.dataset.placed="false";
        makeDraggableSecond(img,slot,correct);
        container.appendChild(img);
    });
    area.appendChild(container);
}

function makeDraggableSecond(el,slot,correct){
    el.draggable=!isMobile();
    if(!isMobile()){ el.ondragstart=()=>selected=el; }
    slot.ondragover=(e)=>e.preventDefault(); slot.ondrop=()=>handleSecondDrop(slot,correct);
    if(isMobile()){
        el.addEventListener('touchstart', e=>{
            if(el.dataset.placed==="true") return;
            selected=el; const rect=el.getBoundingClientRect(); offsetX=e.touches[0].clientX-rect.left; offsetY=e.touches[0].clientY-rect.top;
            clone=el.cloneNode(true); clone.style.position="absolute"; clone.style.zIndex=1000; clone.style.width=rect.width+"px"; clone.style.height=rect.height+"px"; clone.style.pointerEvents="none"; document.body.appendChild(clone);
        });
        el.addEventListener('touchmove', e=>{ if(!clone) return; e.preventDefault(); clone.style.left=(e.touches[0].clientX-offsetX)+"px"; clone.style.top=(e.touches[0].clientY-offsetY)+"px"; });
        el.addEventListener('touchend', ()=>{ if(!clone) return; handleSecondDrop(slot,correct,true); });
    }
}

function handleSecondDrop(slot,correct,isMobileDrop=false){
    if(!selected || slot.children.length) return;
    const cloneEl = selected.cloneNode();
    cloneEl.style.width='auto'; cloneEl.style.height='100%'; cloneEl.style.maxWidth='100%'; cloneEl.style.objectFit='contain';
    slot.appendChild(cloneEl);
    if(selected.src.includes(correct)){
        selected.dataset.placed="true";
        playSound('sound9'); getSpeechBox().innerText="Молодец! Ты узнал все мои рисунки! А теперь нарисуй свою любимую игрушку на бумаге и покажи родителям!";
    } else{
        playSound('sound8'); getSpeechBox().innerText="К сожалению, это неправильный ответ. Я покажу тебе свой рисунок снова";
        setTimeout(showBearPreview,2000);
    }
    if(isMobileDrop) clone.remove(); clone=null; selected=null;
}
</script>

</body>
</html>
